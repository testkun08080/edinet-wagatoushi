name: daily-refresh

on:
  schedule:
    - cron: "10 20 * * *" # 05:10 JST
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target submission date (YYYY-MM-DD), default = today"
        required: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      D1_DATABASE_NAME: ${{ secrets.D1_PRODUCTION_NAME }}
      KV_NAMESPACE_ID: ${{ secrets.KV_PRODUCTION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with: { version: latest }

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: uv sync
        working-directory: apps/wrapper
        run: uv sync --frozen

      - name: Render wrangler configs
        env:
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
          STAGING_D1_ID: ${{ secrets.D1_STAGING_ID }}
          PROD_D1_ID: ${{ secrets.D1_PRODUCTION_ID }}
          STAGING_KV_ID: ${{ secrets.KV_STAGING_ID }}
          PROD_KV_ID: ${{ secrets.KV_PRODUCTION_ID }}
        run: |
          STAGING_API_URL="https://edinet-api-staging.${WORKERS_SUBDOMAIN}.workers.dev"
          PROD_API_URL="https://edinet-api.${WORKERS_SUBDOMAIN}.workers.dev"
          STAGING_WEB_URL="https://edinet-web-staging.${WORKERS_SUBDOMAIN}.workers.dev"
          PROD_WEB_URL="https://edinet-web.${WORKERS_SUBDOMAIN}.workers.dev"
          export STAGING_API_URL PROD_API_URL STAGING_WEB_URL PROD_WEB_URL
          bash infra/render-wrangler-config.sh

      - name: Resolve D1 database name
        run: |
          D1_NAME="${D1_DATABASE_NAME:-edinet-production}"
          echo "D1_NAME=$D1_NAME" >> "$GITHUB_ENV"
          echo "Using D1 database: $D1_NAME"

      - name: Fetch known doc_ids from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 d1 execute "$D1_NAME" --remote \
            --config apps/api/wrangler.toml \
            --env production \
            --command "SELECT doc_id FROM documents" --json \
            > /tmp/known.json || echo "[]" > /tmp/known.json

      - name: Ingest new documents
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        working-directory: apps/wrapper
        run: |
          mkdir -p data
          uv run python scripts/ingest_daily.py \
            --date "${TARGET_DATE:-}" \
            --known-docs /tmp/known.json \
            --output data/edinet.db || true

      - name: Emit delta SQL
        working-directory: apps/wrapper
        run: |
          ## 25h window: cron runs hourly-ish, +1h slack covers retries.
          ## INSERT OR REPLACE in publish_to_d1.py makes the small overlap idempotent.
          since=$(date -u -d "25 hours ago" +%FT%T)
          uv run python scripts/publish_to_d1.py \
            --source data/edinet.db \
            --since "$since" \
            --output /tmp/delta.sql

      - name: Apply delta to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s /tmp/delta.sql ]; then
            npx -y wrangler@4 d1 execute "$D1_NAME" --remote \
              --config apps/api/wrangler.toml \
              --env production \
              --file /tmp/delta.sql
          else
            echo "No delta to apply"
          fi

      - name: Export D1 corpus for metrics rebuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 d1 export "$D1_NAME" --remote \
            --config apps/api/wrangler.toml \
            --env production \
            --output /tmp/corpus.sql
          sqlite3 /tmp/corpus.db < /tmp/corpus.sql

      - name: Rebuild company_metrics
        run: |
          pnpm --filter @edinet/metrics exec tsx ../../infra/init/build-company-metrics.mjs \
            /tmp/corpus.db /tmp/company_metrics.sql
          wc -l /tmp/company_metrics.sql

      - name: Apply company_metrics to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s /tmp/company_metrics.sql ]; then
            npx -y wrangler@4 d1 execute "$D1_NAME" --remote \
              --config apps/api/wrangler.toml \
              --env production \
              --file /tmp/company_metrics.sql
          else
            echo "No company_metrics SQL generated"
          fi

      - name: Rebuild shareholder_snapshots (optional)
        run: |
          if [ -d apps/web/public/data/shareholders ]; then
            pnpm --filter @edinet/metrics exec tsx ../../infra/init/build-shareholder-snapshots.mjs \
              ../../apps/web/public/data/shareholders /tmp/shareholder_snapshots.sql || true
          fi

      - name: Apply shareholder_snapshots to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s /tmp/shareholder_snapshots.sql ]; then
            npx -y wrangler@4 d1 execute "$D1_NAME" --remote \
              --config apps/api/wrangler.toml \
              --env production \
              --file /tmp/shareholder_snapshots.sql
          else
            echo "No shareholder_snapshots SQL to apply"
          fi

      - name: Invalidate metrics KV snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$KV_NAMESPACE_ID" ]; then
            npx -y wrangler@4 kv key delete "screener:metrics:v2" \
              --namespace-id "$KV_NAMESPACE_ID" || true
            echo "Deleted KV key screener:metrics:v2 (rebuilt on next /api/metrics request)"
          else
            echo "KV_NAMESPACE_ID not set, skipping KV invalidation"
          fi

      - name: Snapshot backup to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          date_tag=$(date +%F)
          npx -y wrangler@4 d1 export "$D1_NAME" --remote \
            --config apps/api/wrangler.toml \
            --env production \
            --output /tmp/snapshot.sql || true
          if [ -s /tmp/snapshot.sql ]; then
            npx -y wrangler@4 r2 object put "edinet-data/snapshots/${date_tag}.sql" \
              --file /tmp/snapshot.sql --remote
          fi
